name: Build and deploy

on:
  push:
    branches: [main]
    # Loop guard, and the reason it is written down rather than assumed.
    # The record-state job below commits state/ back to this branch after
    # a successful deploy. Without a guard that push is a push to main,
    # which is a build, which deploys, which commits state again: a
    # runaway that burns minutes and writes a junk entry into the very
    # ledger it exists to protect.
    #
    # Two independent things stop it, and only one of them is visible.
    # GitHub does not raise workflow events for pushes made with the
    # default GITHUB_TOKEN -- true today, invisible in this file, and
    # silently void the moment anyone swaps in a PAT or a GitHub App
    # token to satisfy branch protection. So the guard that survives
    # that change is this one: a commit touching only state/ raises no
    # build. A commit touching state/ and code still builds, because the
    # code change deserves it.
    paths-ignore:
      - "state/**"
  workflow_dispatch:
  schedule:
    # Monthly, 09:47 UTC on the 5th. Delivery is measured to run late
    # (hours, on 2026-08-05) and can drop a slot entirely; if the 5th
    # passes with no run wearing the Scheduled label, tap Run workflow.
    - cron: "47 9 5 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set base path
        # For project-path serving without a custom domain, use: echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
        run: echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"

      - name: Point the carried state at this deployment
        # Where the previous batch's ledger, slug reservations, and data
        # map are read from. A fork MUST change this to its own deployed
        # /data/ URL: left as is, a fork inherits this site's history as
        # if it were its own. NH_STATE_BOOTSTRAP is deliberately not set
        # here, so a build can never quietly restart the chain.
        run: echo "NH_STATE_URL=https://nursinghomerecords.org/data" >> "$GITHUB_ENV"

      - name: Get the monthly zip
        run: |
          if ls data/*.zip >/dev/null 2>&1; then
            echo "Using the zip committed in data/"
          else
            curl -fL --retry 3 -o data/theme_nursing-homes_current.zip \
              "https://data.cms.gov/provider-data/sites/default/files/dataset-archives/current/theme/theme_nursing-homes_current.zip"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb

      - name: Transform the monthly zip
        run: python scripts/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # The committed half of the carried state. Uploaded here, committed
      # only after the deploy succeeds, so the repository copy never
      # claims a batch that was not served.
      - uses: actions/upload-artifact@v4
        with:
          name: carried-state
          path: state/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The ledger chain and the owner-slug reservations are append-only and
  # irreplaceable. Keeping the only copy on the site being rebuilt makes
  # the site its own single point of failure, so the served state is
  # committed back here after every successful deploy.
  record-state:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: carried-state
          path: state

      - name: Commit the state this build served
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state)" ]; then
            echo "carried state unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          # paths-ignore only holds if this commit really is state-only.
          # A future edit that widens the `git add` above would defeat
          # the guard above without touching it, so check rather than
          # trust.
          if git diff --cached --name-only | grep -qv "^state/"; then
            echo "refusing to push: this commit touches files outside state/" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m "State: record the batch served by ${GITHUB_SHA:0:7}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not commit the carried state after 3 attempts" >&2
          exit 1
