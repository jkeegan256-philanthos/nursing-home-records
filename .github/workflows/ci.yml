name: CI

# Runs the synthetic fixture through the full pipeline, builds the site
# from it, then loads that site in a browser and fails on any request
# that leaves this origin. A broken transform, a type error, or a
# re-introduced third-party fetch fails the PR instead of the next
# monthly refresh.

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb pyyaml

      - name: Assert the decision log is intact
        # PROJECT.md claims every decision and reversal is recorded at
        # full length, and it was the one artifact with no check while
        # the code accumulated five. An entry had been malformed since
        # the day it was written -- a scripted edit turned a
        # continuation into a bullet and swallowed the next entry --
        # and a human reading the file was the only thing that found
        # it. Structure only: this cannot tell whether an entry is
        # honest, only whether it is there.
        run: npm run check:doc

      - name: Assert the house prose style holds
        # One character, in prose a stranger reads. Hard to catch by
        # reading, trivial to catch by grep, and left unwritten it
        # recurs in every copy pass forever. The rule and its carve-out
        # for DECISIONS.md, which is append-only, are in PROJECT.md.
        # This is where prose gating stops.
        run: npm run check:prose

      - name: Assert the deploy workflow cannot trigger itself
        run: python3 scripts/check_loop_guard.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Assert the transform's fidelity rules
        run: python3 scripts/test_build_data.py

      - name: Assert the batch diff reports exactly what was planted
        run: python3 scripts/test_diff_batches.py

      - name: Transform the fixture batch
        run: npm run fixture

      - name: Build static site from the fixture
        run: npm run build

      - name: Install Chromium for the origin check
        run: npx playwright install --with-deps chromium

      - name: Assert the pages say what the data says
        # The footer claims figures are shown exactly as published, which
        # is a claim about what the pages render and so needs a check
        # that reads what they rendered. Ratings were drawn as five
        # identical filled glyphs with colour as the only difference, so
        # a copied or scraped page turned every rating into five.
        run: npm run check:rendered

      - name: Assert the site talks only to itself
        # Not a denylist. The failure this replaces was a URL assembled
        # inside a WebAssembly binary at run time, which appears nowhere
        # in the export -- no grep of the files could ever have seen it.
        # This loads the built site in a real browser, exercises both
        # DuckDB-backed views, and fails on any request to a host that
        # is not the one serving the site.
        run: npm run check:origins

      - name: Assert the vendored files are present
        run: |
          set -euo pipefail
          test -f out/duckdb/duckdb-eh.wasm
          test -f out/duckdb/duckdb-mvp.wasm
          test -f out/fonts/public-sans-latin-wght-normal.woff2
          test -f out/fonts/LICENSE-public-sans.txt
          ls out/duckdb/extensions/*/wasm_eh/parquet.duckdb_extension.wasm
          ls out/duckdb/extensions/*/wasm_mvp/parquet.duckdb_extension.wasm
