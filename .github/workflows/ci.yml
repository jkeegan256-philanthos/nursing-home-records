name: CI

# Runs the synthetic fixture through the full pipeline and builds the
# site from it, so a broken transform or type error fails the PR
# instead of the next monthly refresh.

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb pyyaml

      - name: Assert the deploy workflow cannot trigger itself
        run: python3 scripts/check_loop_guard.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Transform the fixture batch
        run: npm run fixture

      - name: Build static site from the fixture
        run: npm run build

      - name: Assert zero third-party loads
        # Links are not loads: anchors to CMS or GitHub are fine. This
        # gate fails on resource CDNs anywhere, on any external origin
        # in a loading position, and on missing vendored assets.
        run: |
          set -euo pipefail
          if grep -rIlE "fonts\.googleapis\.com|fonts\.gstatic\.com|jsdelivr|unpkg\.com|cdnjs\.cloudflare\.com|esm\.sh" out/; then
            echo "FAIL: resource CDN reference in the export"; exit 1; fi
          if grep -rIE '<script[^>]{0,300}src="https?://' out/ --include='*.html'; then
            echo "FAIL: external script load"; exit 1; fi
          if grep -rIE '<link[^>]{0,300}href="https?://' out/ --include='*.html'; then
            echo "FAIL: external link load"; exit 1; fi
          if grep -rIE 'url\(\s*["'"'"']?https?://' out/ --include='*.css'; then
            echo "FAIL: external css url()"; exit 1; fi
          test -f out/duckdb/duckdb-eh.wasm
          test -f out/duckdb/duckdb-mvp.wasm
          test -f out/fonts/public-sans-latin-wght-normal.woff2
          test -f out/fonts/LICENSE-public-sans.txt
          echo "zero third-party loads confirmed"
