name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly, 09:47 UTC on the 5th. Delivery is measured to run late
    # (hours, on 2026-08-05) and can drop a slot entirely; if the 5th
    # passes with no run wearing the Scheduled label, tap Run workflow.
    - cron: "47 9 5 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set base path
        # For project-path serving without a custom domain, use: echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
        run: echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"

      - name: Point the carried state at this deployment
        # Where the previous batch's ledger, slug reservations, and data
        # map are read from. A fork MUST change this to its own deployed
        # /data/ URL: left as is, a fork inherits this site's history as
        # if it were its own. NH_STATE_BOOTSTRAP is deliberately not set
        # here, so a build can never quietly restart the chain.
        run: echo "NH_STATE_URL=https://nursinghomerecords.org/data" >> "$GITHUB_ENV"

      - name: Get the monthly zip
        run: |
          if ls data/*.zip >/dev/null 2>&1; then
            echo "Using the zip committed in data/"
          else
            curl -fL --retry 3 -o data/theme_nursing-homes_current.zip \
              "https://data.cms.gov/provider-data/sites/default/files/dataset-archives/current/theme/theme_nursing-homes_current.zip"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb

      - name: Transform the monthly zip
        run: python scripts/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install Chromium for the origin check
        run: npx playwright install --with-deps chromium

      - name: Assert the deployed site will talk only to itself
        # The pull-request run checks the fixture export. This checks the
        # export that is actually about to be served, with the real batch
        # behind it, because the claim on the Data page is about this
        # build and not about a synthetic one. Nothing deploys if it
        # fails.
        run: npm run check:origins

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # The committed half of the carried state. Uploaded here, committed
      # only after the deploy succeeds, so the repository copy never
      # claims a batch that was not served.
      - uses: actions/upload-artifact@v4
        with:
          name: carried-state
          path: state/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The ledger chain and the owner-slug reservations are append-only and
  # irreplaceable. Keeping the only copy on the site being rebuilt makes
  # the site its own single point of failure, so the served state is
  # committed back here after every successful deploy.
  record-state:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: carried-state
          path: state

      - name: Commit the state this build served
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state)" ]; then
            echo "carried state unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "State: record the batch served by ${GITHUB_SHA:0:7}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not commit the carried state after 3 attempts" >&2
          exit 1
